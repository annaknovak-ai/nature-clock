<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שעון הטבע</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Heebo:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --text: #ffffff;
    --glass-a: rgba(255, 255, 255, 0.16);
    --glass-b: rgba(10, 20, 45, 0.3);
    --border: rgba(255, 255, 255, 0.3);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #0a0f2a;
    color: var(--text);
    font-family: 'Heebo', system-ui, sans-serif;
  }
  canvas#scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .clock {
    position: fixed;
    left: 50%;
    top: 40%;
    transform: translate(-50%, -50%);
    width: max-content;
    max-width: calc(100vw - 32px);
    padding: clamp(16px, 3vw, 34px) clamp(22px, 5vw, 64px);
    border-radius: 30px;
    background: linear-gradient(135deg, var(--glass-a), var(--glass-b));
    border: 1px solid var(--border);
    backdrop-filter: blur(12px) saturate(140%);
    -webkit-backdrop-filter: blur(12px) saturate(140%);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    text-align: center;
    user-select: none;
  }
  .greeting {
    font-weight: 300;
    font-size: clamp(1rem, 2.4vw, 1.5rem);
    letter-spacing: 0.06em;
    opacity: 0.92;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
  }
  .time {
    direction: ltr;
    font-family: 'Orbitron', monospace;
    font-weight: 700;
    font-size: clamp(2.4rem, 11vw, 8.5rem);
    line-height: 1.15;
    display: flex;
    align-items: baseline;
    justify-content: center;
    text-shadow: 0 0 28px rgba(255, 255, 255, 0.45), 0 4px 18px rgba(0, 0, 0, 0.35);
  }
  .time .d { display: inline-block; width: 0.8em; text-align: center; }
  .time .colon { display: inline-block; width: 0.36em; text-align: center; animation: blink 1s steps(1) infinite; }
  .time .sec { font-size: 0.42em; opacity: 0.85; margin-left: 0.25em; display: inline-flex; }
  @keyframes blink { 50% { opacity: 0.2; } }
  .date {
    font-size: clamp(0.95rem, 2.2vw, 1.35rem);
    font-weight: 400;
    opacity: 0.92;
    margin-top: 0.2em;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
  }
  .phase {
    display: inline-block;
    margin-top: 0.8em;
    padding: 0.25em 0.9em;
    border-radius: 999px;
    font-size: clamp(0.8rem, 1.6vw, 0.95rem);
    background: rgba(255, 255, 255, 0.14);
    border: 1px solid rgba(255, 255, 255, 0.22);
  }

  .demo {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    padding: 0.55em 1.2em;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--text);
    font: 400 0.95rem 'Heebo', sans-serif;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .demo:hover { background: rgba(255, 255, 255, 0.26); }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<main class="clock" aria-live="polite">
  <div class="greeting" id="greeting">שלום</div>
  <div class="time" aria-label="השעה הנוכחית">
    <span class="d" id="h1">0</span><span class="d" id="h2">0</span>
    <span class="colon">:</span>
    <span class="d" id="m1">0</span><span class="d" id="m2">0</span>
    <span class="sec"><span class="d" id="s1">0</span><span class="d" id="s2">0</span></span>
  </div>
  <div class="date" id="date"></div>
  <div class="phase" id="phase"></div>
</main>

<button class="demo" id="demo">▶ צפו ביום שלם ב-30 שניות</button>

<script>
(() => {
  const cvs = document.getElementById('scene');
  const ctx = cvs.getContext('2d');
  let W, H, DPR, HZ;
  let layers = [], shore = null, stars = [], clouds = [], birds = [], flies = [], reeds = [];
  let shooting = null;

  // ---------- helpers ----------
  const rng = s => () => (s = (s * 16807) % 2147483647) / 2147483647;
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
  const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const WHITE = [255, 255, 255], BLACK = [0, 0, 0];

  // ---------- sky palette through the day: [hour, top, middle, bottom, light] ----------
  const KEYS = [
    [0,    '#050816', '#0b1430', '#1a2348', 0],
    [4.5,  '#070b1e', '#121a3a', '#2a2a55', 0],
    [5.5,  '#1b2350', '#5a4a7a', '#e08a6a', 0.25],
    [6.5,  '#3a5ba0', '#e8a07a', '#ffcf8a', 0.6],
    [8,    '#4a8fd8', '#8cc3ef', '#d6ecf7', 1],
    [12,   '#2f7fd6', '#7ab8ee', '#cfe8f8', 1],
    [16,   '#3f86d0', '#8fc0e8', '#f0e2c0', 1],
    [18.5, '#2c3e7a', '#d9735a', '#ffb35c', 0.6],
    [19.5, '#1a1f4a', '#6a3d6e', '#d06a50', 0.25],
    [20.5, '#0a0f2a', '#1a1d45', '#3a2d55', 0],
    [24,   '#050816', '#0b1430', '#1a2348', 0],
  ].map(k => [k[0], hex(k[1]), hex(k[2]), hex(k[3]), k[4]]);

  function palette(h) {
    for (let i = 0; i < KEYS.length - 1; i++) {
      const a = KEYS[i], b = KEYS[i + 1];
      if (h >= a[0] && h <= b[0]) {
        const t = (h - a[0]) / (b[0] - a[0]);
        const s = t * t * (3 - 2 * t);
        return { top: mix(a[1], b[1], s), mid: mix(a[2], b[2], s), bot: mix(a[3], b[3], s), L: a[4] + (b[4] - a[4]) * s };
      }
    }
    return palette(0);
  }

  const LAYER_DEF = [
    { seed: 11, base: 0.16, amp: 0.36, rough: 0.56, day: '#7a98b8', night: '#1c2440', haze: 0.5, snow: true },
    { seed: 23, base: 0.08, amp: 0.22, rough: 0.5,  day: '#4f7d70', night: '#141a30', haze: 0.28 },
    { seed: 37, base: 0.02, amp: 0.11, rough: 0.45, day: '#2f5a3f', night: '#0d1222', haze: 0.1, trees: true },
  ];

  const N = 256;
  function ridge(seed, rough) {
    const r = rng(seed);
    const p = new Float32Array(N + 1);
    p[0] = r(); p[N] = r();
    let step = N, a = 1;
    while (step > 1) {
      const h = step / 2;
      for (let i = h; i < N; i += step) p[i] = (p[i - h] + p[i + h]) / 2 + (r() - 0.5) * a;
      a *= rough; step = h;
    }
    let mn = Infinity, mx = -Infinity;
    for (const v of p) { mn = Math.min(mn, v); mx = Math.max(mx, v); }
    for (let i = 0; i <= N; i++) p[i] = (p[i] - mn) / (mx - mn);
    return p;
  }
  const yAt = (ys, x) => {
    const f = clamp(x / W) * N, i = Math.floor(f), t = f - i;
    return i >= N ? ys[N] : ys[i] + (ys[i + 1] - ys[i]) * t;
  };

  // ---------- build the world ----------
  function build() {
    layers = LAYER_DEF.map(def => {
      const p = ridge(def.seed, def.rough);
      const ys = Array.from(p, v => HZ - (def.base + v * def.amp) * HZ);
      const top = Math.min(...ys);
      const trees = [];
      if (def.trees) {
        const r = rng(99);
        for (let x = -5; x < W + 5; x += 3 + r() * 9) {
          trees.push({ x, y: yAt(ys, x) + 3, h: 8 + r() * 20 + (r() < 0.1 ? 10 : 0) });
        }
      }
      return { def, ys, top, trees };
    });

    // shoreline hills framing the lake, with tall pines
    const sp = ridge(51, 0.5);
    const mask = x => Math.pow(Math.max(0, 1 - x / (W * 0.3), (x - W * 0.7) / (W * 0.3)), 1.4);
    const sys = Array.from(sp, (v, i) => HZ - mask(i / N * W) * (H * 0.035 + v * H * 0.03));
    const sr = rng(77), strees = [];
    for (let x = -20; x < W + 20; x += 5 + sr() * 12) {
      const m = mask(clamp(x, 0, W));
      if (m < 0.12) continue;
      strees.push({ x, y: yAt(sys, x) + 4, h: (H * 0.05 + sr() * H * 0.08) * (0.55 + m), shade: sr() });
    }
    strees.sort((a, b) => b.shade - a.shade);
    shore = { ys: sys, trees: strees };

    const r = rng(5);
    stars = [];
    const ns = Math.min(450, (W * HZ) / 2200);
    for (let i = 0; i < ns; i++) {
      stars.push({ x: r() * W, y: Math.pow(r(), 1.3) * HZ * 0.95, s: 0.4 + Math.pow(r(), 3) * 1.6, ph: r() * 6.28, sp: 0.8 + r() * 2.5 });
    }

    clouds = [];
    for (let i = 0; i < 7; i++) {
      const puffs = [], n = 6 + Math.floor(r() * 5);
      for (let k = 0; k < n; k++) {
        const dx = (k / (n - 1) - 0.5) * 220 + (r() - 0.5) * 30;
        puffs.push({ dx, dy: -(1 - Math.abs(dx) / 130) * r() * 32, r: 22 + r() * 30 * (1 - Math.abs(dx) / 200) });
      }
      clouds.push({ x: r() * (W + 400) - 200, y: HZ * (0.1 + r() * 0.4), s: (0.45 + r() * 0.8) * Math.min(1.2, W / 1200 + 0.4), v: 5 + r() * 12, puffs });
    }

    flies = [];
    for (let i = 0; i < 70; i++) {
      flies.push({ x: r() * W, y: HZ - H * 0.12 + r() * (H - HZ + H * 0.12), vx: (r() - 0.5) * 20, vy: (r() - 0.5) * 10, ph: r() * 6.28 });
    }

    reeds = [];
    for (let side = 0; side < 2; side++) {
      for (let i = 0; i < 34; i++) {
        const d = Math.pow(r(), 1.6) * W * 0.24;
        reeds.push({
          x: side ? W - d : d,
          h: H * (0.06 + r() * 0.15) * (1 - d / (W * 0.4)),
          lean: (side ? -1 : 1) * (r() * 18 - 4),
          w: 1.2 + r() * 2.2, ph: r() * 6.28,
          cat: r() < 0.25,
        });
      }
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    HZ = Math.round(H * (W < 700 ? 0.68 : 0.7));
    build();
  }

  // ---------- celestial bodies ----------
  const arc = p => ({ x: W * (0.08 + 0.84 * p), y: HZ - Math.sin(p * Math.PI) * HZ * 0.82, e: Math.sin(p * Math.PI) });
  const sunInfo = h => arc((h - 6) / 13);
  const moonInfo = h => arc((((h - 19) + 24) % 24) / 11);

  function drawSky(pal) {
    const g = ctx.createLinearGradient(0, 0, 0, HZ);
    g.addColorStop(0, rgb(pal.top));
    g.addColorStop(0.55, rgb(pal.mid));
    g.addColorStop(1, rgb(pal.bot));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, HZ + 2);
  }

  function drawStars(pal, t, dt) {
    const a = clamp((0.55 - pal.L) / 0.55);
    if (a <= 0) return;
    ctx.fillStyle = '#fff';
    for (const s of stars) {
      ctx.globalAlpha = a * (0.55 + 0.45 * Math.sin(t * s.sp + s.ph)) * (1 - (s.y / HZ) * 0.6);
      if (s.s > 1) { ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, 6.283); ctx.fill(); }
      else ctx.fillRect(s.x, s.y, s.s * 1.4, s.s * 1.4);
    }
    ctx.globalAlpha = 1;

    if (!shooting && a > 0.6 && Math.random() < dt * 0.25) {
      shooting = { x: W * (0.3 + Math.random() * 0.7), y: HZ * (0.05 + Math.random() * 0.3), vx: -(500 + Math.random() * 300), vy: 200 + Math.random() * 120, life: 1 };
    }
    if (shooting) {
      const s = shooting;
      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt * 1.3;
      const tx = s.x - s.vx * 0.18, ty = s.y - s.vy * 0.18;
      const g = ctx.createLinearGradient(s.x, s.y, tx, ty);
      g.addColorStop(0, `rgba(255,255,255,${clamp(s.life) * a})`);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(tx, ty); ctx.stroke();
      if (s.life <= 0) shooting = null;
    }
  }

  function drawSun(sun) {
    if (sun.y > HZ + 60) return;
    const c = mix([255, 120, 50], [255, 250, 225], clamp(sun.e * 2.2));
    const R = Math.min(W, H) * 0.04;
    let g = ctx.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, HZ * 0.95);
    g.addColorStop(0, rgb(c, 0.6));
    g.addColorStop(0.12, rgb(c, 0.25));
    g.addColorStop(1, rgb(c, 0));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, HZ + 2);
    g = ctx.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, R);
    g.addColorStop(0, '#fffef6');
    g.addColorStop(0.7, rgb(mix(c, WHITE, 0.5)));
    g.addColorStop(1, rgb(c));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(sun.x, sun.y, R, 0, 6.283); ctx.fill();
  }

  function drawMoon(moon) {
    if (moon.y > HZ + 40) return;
    const R = Math.min(W, H) * 0.032;
    let g = ctx.createRadialGradient(moon.x, moon.y, R * 0.5, moon.x, moon.y, HZ * 0.5);
    g.addColorStop(0, 'rgba(190,205,255,0.28)');
    g.addColorStop(1, 'rgba(190,205,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, HZ + 2);
    g = ctx.createRadialGradient(moon.x - R * 0.3, moon.y - R * 0.3, R * 0.1, moon.x, moon.y, R);
    g.addColorStop(0, '#fffdf2');
    g.addColorStop(1, '#d9d6c6');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(moon.x, moon.y, R, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(120,115,100,0.18)';
    for (const [cx, cy, cr] of [[-0.3, -0.2, 0.22], [0.25, 0.1, 0.16], [-0.05, 0.4, 0.12], [0.35, -0.35, 0.1]]) {
      ctx.beginPath(); ctx.arc(moon.x + cx * R, moon.y + cy * R, cr * R, 0, 6.283); ctx.fill();
    }
  }

  function drawClouds(pal, dt, speed) {
    const lit = mix(mix(WHITE, pal.bot, 0.15 + 0.45 * (1 - pal.L)), pal.mid, (1 - pal.L) * 0.55);
    const shade = mix(lit, pal.top, 0.35);
    const alpha = 0.55 + 0.35 * pal.L;
    for (const c of clouds) {
      c.x += c.v * dt * speed;
      if (c.x - 200 * c.s > W) c.x = -200 * c.s;
      ctx.beginPath();
      for (const p of c.puffs) {
        const x = c.x + p.dx * c.s, y = c.y + p.dy * c.s, rr = p.r * c.s;
        ctx.moveTo(x + rr, y);
        ctx.arc(x, y, rr, 0, 6.283);
      }
      const g = ctx.createLinearGradient(0, c.y - 70 * c.s, 0, c.y + 40 * c.s);
      g.addColorStop(0, rgb(lit, alpha));
      g.addColorStop(1, rgb(shade, alpha * 0.85));
      ctx.fillStyle = g;
      ctx.fill();
    }
  }

  // ---------- land ----------
  function pine(x, y, h) {
    const w = h * 0.36;
    ctx.moveTo(x, y - h);
    for (let k = 0; k < 3; k++) {
      const ty = y - h + k * h * 0.24, bw = w * (0.55 + k * 0.25);
      ctx.moveTo(x, ty); ctx.lineTo(x - bw, ty + h * 0.42); ctx.lineTo(x + bw, ty + h * 0.42); ctx.closePath();
    }
    ctx.rect(x - h * 0.03, y - h * 0.14, h * 0.06, h * 0.14);
  }

  function drawMountains(pal) {
    const fog = mix(pal.bot, WHITE, 0.12);
    layers.forEach((ly, i) => {
      const def = ly.def;
      const col = mix(mix(hex(def.night), hex(def.day), pal.L), pal.bot, def.haze);
      ctx.beginPath();
      ctx.moveTo(0, HZ + 1);
      for (let k = 0; k <= N; k++) ctx.lineTo((k / N) * W, ly.ys[k]);
      ctx.lineTo(W, HZ + 1);
      ctx.closePath();
      const g = ctx.createLinearGradient(0, ly.top, 0, HZ);
      g.addColorStop(0, rgb(mix(col, WHITE, 0.1 * pal.L)));
      g.addColorStop(1, rgb(mix(col, BLACK, 0.25)));
      ctx.fillStyle = g;
      ctx.fill();

      if (def.snow) {
        ctx.save();
        ctx.clip();
        const depth = HZ * def.amp * 0.4;
        const sc = mix(WHITE, pal.bot, 0.3);
        const sg = ctx.createLinearGradient(0, ly.top, 0, ly.top + depth);
        sg.addColorStop(0, rgb(sc, 0.25 + 0.6 * pal.L));
        sg.addColorStop(1, rgb(sc, 0));
        ctx.fillStyle = sg;
        ctx.fillRect(0, ly.top, W, depth);
        ctx.restore();
      }

      if (def.trees) {
        ctx.fillStyle = rgb(mix(mix([8, 12, 24], [26, 66, 42], pal.L), pal.bot, 0.06));
        ctx.beginPath();
        for (const t of ly.trees) pine(t.x, t.y, t.h);
        ctx.fill();
      }

      if (i < layers.length - 1) {
        const y0 = ly.top + (HZ - ly.top) * 0.45;
        const fg = ctx.createLinearGradient(0, y0, 0, HZ);
        fg.addColorStop(0, rgb(fog, 0));
        fg.addColorStop(1, rgb(fog, 0.4));
        ctx.fillStyle = fg;
        ctx.fillRect(0, y0, W, HZ - y0);
      }
    });
  }

  function drawShore(pal) {
    const land = mix([5, 8, 16], [18, 46, 30], pal.L);
    ctx.fillStyle = rgb(land);
    ctx.beginPath();
    ctx.moveTo(0, HZ + 1);
    for (let k = 0; k <= N; k++) ctx.lineTo((k / N) * W, shore.ys[k]);
    ctx.lineTo(W, HZ + 1);
    ctx.fill();
    let cur = -1;
    for (const t of shore.trees) {
      const band = t.shade > 0.5 ? 1 : 0;
      if (band !== cur) {
        if (cur !== -1) ctx.fill();
        cur = band;
        ctx.fillStyle = rgb(band ? mix(land, pal.bot, 0.12) : mix(land, BLACK, 0.2));
        ctx.beginPath();
      }
      pine(t.x, t.y, t.h);
    }
    ctx.fill();
  }

  function drawLake(pal, t, sun, moon) {
    const lh = H - HZ;
    for (let j = 0; j < lh; j += 2) {
      const k = j / lh;
      const dx = Math.sin(j * 0.09 * (1 - k * 0.5) - t * 1.4) * (0.5 + k * 7) + Math.sin(j * 0.31 + t * 2.3) * (0.3 + k * 2);
      const sy = Math.max(0, HZ - j * 0.95 - 2);
      ctx.drawImage(cvs, 0, sy * DPR, W * DPR, 2 * DPR, dx, HZ + j, W, 2.5);
    }
    const wc = mix(mix([6, 12, 30], [30, 95, 125], pal.L), pal.mid, 0.25);
    const g = ctx.createLinearGradient(0, HZ, 0, H);
    g.addColorStop(0, rgb(wc, 0.22));
    g.addColorStop(1, rgb(mix(wc, BLACK, 0.55), 0.85));
    ctx.fillStyle = g;
    ctx.fillRect(0, HZ, W, lh);

    // ripple lines
    ctx.fillStyle = `rgba(255,255,255,${0.04 + 0.05 * pal.L})`;
    for (let i = 0; i < 46; i++) {
      const k = ((i * 0.618 + t * 0.02) % 1);
      const y = HZ + Math.pow(k, 1.5) * lh;
      const x = ((i * 397.3 + t * (8 + (i % 5) * 4)) % (W + 200)) - 100;
      ctx.fillRect(x, y, 30 + k * 160, 0.6 + k * 1.2);
    }

    // glittering light path on the water
    ctx.globalCompositeOperation = 'lighter';
    const glint = (src, strength, col) => {
      if (strength <= 0.01) return;
      for (let i = 0; i < 90; i++) {
        const k = Math.pow(i / 90, 1.25);
        const y = HZ + 2 + k * lh;
        const spread = 6 + k * lh * 0.35 * (1.3 - Math.max(0, src.e));
        const x = src.x + Math.sin(i * 12.9898 + Math.floor(t * 2 + i * 0.37) * 4.1) * spread;
        const a = strength * (0.35 + 0.65 * Math.pow(0.5 + 0.5 * Math.sin(t * 5 + i * 7.3), 2)) * (1 - k * 0.5);
        ctx.fillStyle = rgb(col, a);
        ctx.beginPath(); ctx.ellipse(x, y, 4 + k * 26, 0.8 + k * 1.6, 0, 0, 6.283); ctx.fill();
      }
    };
    glint(sun, clamp(sun.e * 4) * 0.5, mix([255, 140, 60], [255, 245, 210], clamp(sun.e * 2)));
    glint(moon, clamp(moon.e * 4) * 0.35, [210, 220, 255]);
    ctx.globalCompositeOperation = 'source-over';

    ctx.fillStyle = `rgba(255,255,255,${0.08 + 0.1 * pal.L})`;
    ctx.fillRect(0, HZ, W, 1);
  }

  // ---------- life ----------
  function drawBirds(pal, dt, t, speed) {
    if (pal.L > 0.4 && birds.length < 16 && Math.random() < dt * 0.12 * speed) {
      const dir = Math.random() < 0.5 ? 1 : -1, n = 4 + Math.floor(Math.random() * 6);
      const y0 = HZ * (0.15 + Math.random() * 0.45), v = 40 + Math.random() * 35;
      for (let k = 0; k < n; k++) {
        const off = k - (n - 1) / 2;
        birds.push({ x: (dir > 0 ? -60 : W + 60) - dir * Math.abs(off) * 22, y: y0 + Math.abs(off) * 12 + off * 2, v: v * dir, s: 4 + Math.random() * 3, ph: Math.random() * 6.28 });
      }
    }
    ctx.strokeStyle = rgb(mix([20, 25, 40], pal.top, 0.2), 0.8 * clamp(pal.L * 1.6));
    ctx.lineWidth = 1.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (const b of birds) {
      b.x += b.v * dt * speed;
      b.y += Math.sin(t * 1.3 + b.ph) * 0.15;
      const w = Math.sin(t * 9 + b.ph), s = b.s;
      ctx.moveTo(b.x - s, b.y - s * 0.6 * w);
      ctx.quadraticCurveTo(b.x - s * 0.4, b.y - s * 0.25, b.x, b.y);
      ctx.quadraticCurveTo(b.x + s * 0.4, b.y - s * 0.25, b.x + s, b.y - s * 0.6 * w);
    }
    ctx.stroke();
    birds = birds.filter(b => b.x > -400 && b.x < W + 400);
  }

  function drawReeds(pal, t) {
    ctx.strokeStyle = ctx.fillStyle = rgb(mix([3, 5, 10], [18, 38, 22], pal.L));
    ctx.lineCap = 'round';
    for (const r of reeds) {
      const sway = Math.sin(t * 1.1 + r.ph + r.x * 0.01) * r.h * 0.06;
      const tx = r.x + r.lean + sway, ty = H - r.h;
      ctx.lineWidth = r.w;
      ctx.beginPath();
      ctx.moveTo(r.x, H + 4);
      ctx.quadraticCurveTo(r.x + r.lean * 0.3, H - r.h * 0.5, tx, ty);
      ctx.stroke();
      if (r.cat) {
        ctx.beginPath();
        ctx.ellipse(tx - (r.lean + sway) * 0.05, ty + r.h * 0.1, r.w * 1.6, r.h * 0.07, Math.atan2(r.lean + sway, r.h) * 0.6, 0, 6.283);
        ctx.fill();
      }
    }
  }

  function drawFlies(pal, dt, t) {
    const night = clamp((0.5 - pal.L) / 0.5);
    ctx.globalCompositeOperation = 'lighter';
    for (const f of flies) {
      f.vx = clamp(f.vx + (Math.random() - 0.5) * 30 * dt, -18, 18);
      f.vy = clamp(f.vy + (Math.random() - 0.5) * 30 * dt, -10, 10);
      f.x += f.vx * dt; f.y += f.vy * dt;
      if (f.x < -10) f.x = W + 10; if (f.x > W + 10) f.x = -10;
      if (f.y < HZ - H * 0.14) f.vy += 4; if (f.y > H) f.vy -= 4;
      if (night > 0) {
        const a = night * Math.pow(0.5 + 0.5 * Math.sin(t * 2.2 + f.ph), 3);
        if (a > 0.02) {
          const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 11);
          g.addColorStop(0, `rgba(230,255,150,${a})`);
          g.addColorStop(0.25, `rgba(190,255,90,${a * 0.5})`);
          g.addColorStop(1, 'rgba(160,255,80,0)');
          ctx.fillStyle = g;
          ctx.fillRect(f.x - 11, f.y - 11, 22, 22);
        }
      }
      if (night < 1) {
        ctx.fillStyle = `rgba(255,252,230,${(1 - night) * 0.45 * (0.6 + 0.4 * Math.sin(t * 3 + f.ph))})`;
        ctx.beginPath(); ctx.arc(f.x, f.y, 1.3, 0, 6.283); ctx.fill();
      }
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // ---------- clock ----------
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  let lastSec = -1;
  function updateClock(sceneH) {
    const d = new Date();
    if (d.getSeconds() === lastSec) return;
    lastSec = d.getSeconds();
    const [hh, mm, ss] = [pad(d.getHours()), pad(d.getMinutes()), pad(d.getSeconds())];
    $('h1').textContent = hh[0]; $('h2').textContent = hh[1];
    $('m1').textContent = mm[0]; $('m2').textContent = mm[1];
    $('s1').textContent = ss[0]; $('s2').textContent = ss[1];
    $('date').textContent = d.toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    const h = d.getHours();
    $('greeting').textContent = h >= 5 && h < 12 ? 'בוקר טוב ☀' : h >= 12 && h < 17 ? 'צהריים טובים' : h >= 17 && h < 21 ? 'ערב טוב' : 'לילה טוב ☾';
    if (!demo) $('phase').textContent = phaseName(sceneH);
  }
  function phaseName(h) {
    if (h < 4.5 || h >= 21) return '✦ לילה זרוע כוכבים';
    if (h < 5.8) return 'שחר';
    if (h < 7.2) return 'זריחה';
    if (h < 11) return 'בוקר';
    if (h < 14) return 'צהריים';
    if (h < 17.5) return 'אחר הצהריים';
    if (h < 19.3) return 'שקיעה';
    return 'בין ערביים';
  }

  // ---------- time of scene (real, fixed via ?h=, or 30s demo) ----------
  const fixedH = parseFloat(new URLSearchParams(location.search).get('h'));
  let demo = null;
  const realHour = () => { const d = new Date(); return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600; };
  function sceneHour(t) {
    if (demo) {
      const h = (demo.startH + ((t - demo.t0) / 30) * 24) % 24;
      if (t - demo.t0 >= 30) stopDemo();
      return h;
    }
    return isNaN(fixedH) ? realHour() : fixedH % 24;
  }
  const btn = $('demo');
  function stopDemo() { demo = null; btn.textContent = '▶ צפו ביום שלם ב-30 שניות'; lastSec = -1; }
  btn.addEventListener('click', () => {
    if (demo) return stopDemo();
    demo = { t0: performance.now() / 1000, startH: isNaN(fixedH) ? realHour() : fixedH };
    btn.textContent = '■ עצירה';
  });

  // ---------- main loop ----------
  let last = performance.now() / 1000;
  function frame(now) {
    const t = now / 1000, dt = Math.min(0.05, t - last);
    last = t;
    const h = sceneHour(t);
    const pal = palette(h);
    const sun = sunInfo(h), moon = moonInfo(h);
    const speed = demo ? 10 : 1;

    drawSky(pal);
    drawStars(pal, t, dt);
    drawMoon(moon);
    drawSun(sun);
    drawClouds(pal, dt, speed);
    drawBirds(pal, dt, t, speed);
    drawMountains(pal);
    drawShore(pal);
    drawLake(pal, t, sun, moon);
    drawReeds(pal, t);
    drawFlies(pal, dt, t);

    updateClock(h);
    if (demo) $('phase').textContent = `שעת הנוף ${pad(Math.floor(h))}:${pad(Math.floor((h % 1) * 60))} · ${phaseName(h)}`;
    requestAnimationFrame(frame);
  }

  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
